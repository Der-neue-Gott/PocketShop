<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <title>PocketShop - фоторедактор онлайн: фильтры и текст на фото</title>
  <meta name="description" content="Бесплатный онлайн редактор изображений в браузере. Быстрая обрезка, кадрирование, поворот, текстовые слои и фильтры без регистрации.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="PocketShop - бесплатный редактор фото">
  <meta property="og:description" content="Удобный редактор картинок прямо в браузере.">
  <meta property="og:image" content="https://pocket-shop.vercel.app/preview.png">
  <meta property="og:url" content="https://pocket-shop.vercel.app/">

</head>
<body>
  
  <h1>PocketShop - Photo Editor</h1>

  <div class="editor-container">
    <canvas id="imgCanvas" width="600" height="400"></canvas>


    <div class="controls">
      <input type="file" id="imageInput" accept="image/*" hidden>
      <label for="imageInput" class="file-upload-btn">Загрузить фото</label>

      <div style="display: flex; gap: 8px">
        <button id="undoBtn" style="background: #3f4251; color: #fff" disabled>↩ Отмена</button>
        <button id="redoBtn" style="background: #3f4251; color: #fff" disabled>↪ Повтор</button>
      </div>


      <div class="control-group">
        <label for="filterPreset">Фильтр:</label>
        <select id="filterPreset" disabled>
          <option value="none">Обычный</option>
          <option value="grayscale">Черно-белое</option>
          <option value="sepia">Сепия</option>
          <option value="invert">Инверсия</option>
        </select>
      </div>

      <div class="control-group">
        <label for="brightnessInput">Яркость:</label>
        <input type="range" id="brightnessInput" min="50" max="150" value="100" disabled>
      </div>

      <div class="control-group">
        <label for="contrastInput">Контраст:</label>
        <input type="range" id="contrastInput" min="50" max="150" value="100" disabled>
      </div>

      <div class="control-group">
        <label for="blurInput">Размытие:</label>
        <input type="range" id="blurInput" min="0" max="10" value="0" step="0.5" disabled>
      </div>


      <button id="addTextBtn" disabled>+ Добавить текст</button>
      <input type="text" id="selectedTextInput" placeholder="Текст..." disabled>

      <input type="file" id="exImageInput" accept="image/*" hidden>
      <label for="exImageInput" id="exImageBtn" class="file-upload-btn">+ Добавить фото</label>


      <select id="fontFamilySelect" disabled>
        <option value="Impact">Impact</option>
        <option value="Arial">Arial</option>
        <option value="Comic Sans MS">Comic Sans</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
      </select>

      <div class="control-group">
        <label for="fontSizeInput">Размер:</label>
        <input type="number" id="fontSizeInput" min="10" max="120" value="36" disabled style="width: 70px;">
      </div>

      <div class="control-group">
        <label for="textColorInput">Цвет:</label>
        <input type="color" id="textColorInput" value="#ffffff" disabled>
      </div>

      <div class="control-group">
        <label for="strokeColorInput">Обводка:</label>
        <input type="color" id="strokeColorInput" value="#000000" disabled>
      </div>


      <button id="deleteTextBtn" style="background: #ff4d4d; color: #fff;" disabled>Удалить</button>
      <button id="downloadBtn" disabled>Скачать фото</button>
    </div>


  </div>
  <script type="module" src="src/main.ts"></script>
</body>
</html>
